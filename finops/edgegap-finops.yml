description: >-
  FinOps view of Edgegap spend. Edgegap bills usage-based rates for dedicated
  game-server orchestration: server compute time (vCPU/RAM per deployment
  duration), egress bandwidth per GB, and distributed relay traffic per GB.
  A free tier and Enterprise volume commitments also apply. Cost is driven by
  how long servers run, how many run concurrently, and how much bandwidth
  players consume across edge locations.
notes: >-
  Per-unit rates are subject to change; verify against the Edgegap pricing page
  during reconciliation.
