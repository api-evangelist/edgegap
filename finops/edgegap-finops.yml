meters:
- name: server_compute_hours
  description: Dedicated server compute time billed by container size (vCPU/RAM) and deployment duration.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - application
  - location
- name: egress_bandwidth_gb
  description: Outbound network egress from deployed servers, billed per GB.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - deployment
  - location
- name: relay_traffic_gb
  description: Traffic routed through distributed relay sessions, billed per GB.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - relay_session
- name: concurrent_deployments
  description: Peak concurrent running deployments, relevant to tier and capacity planning.
  unit: deployments
  aggregation: max
  dimensions:
  - account
  - application
principles:
- name: Visibility
  description: Pull Edgegap usage exports and deployment metrics; inspect server-hours and egress per application and location.
- name: Allocation
  description: Tag deployments per game/build/team; map to internal cost centers.
- name: Optimization
  description: Right-size container vCPU/RAM; stop idle deployments promptly; auto-deploy near players to cut egress; use private fleets for steady baseline load.
- name: Accountability
  description: Assign owners per game/environment; review server-hour and bandwidth spend monthly against budget.
