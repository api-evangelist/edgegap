          items:
            $ref: '#/components/schemas/AppVersionEnv'
        verify_image:
          type: boolean
          description: By enabling the verify_image option, your image information (docker_repository, docker_image, docker_tag) will be tested to ensure the image can be pulled successfully.
          default: false
          example: true
        termination_grace_period_seconds:
          type: integer
