openapi: 3.2.0
info:
  title: Edgegap V1 Deployments API
  version: 0.0.0
  description: 'Introduction


    The Edgegap API lets you manage all your resources from standard HTTP requests. We promote using them to automate all your processes that are using Edgegap.


    If you have any questions, don''t hesitate to contact us via email, or you can also jump on our Discord. We will be happy to help. Feel free to make features request; we also love those.


    Pagination - Response​


    The GET response body can be returned with pagination to avoid requesting all the data at once.


    Pagination object will always be under the paginator key.


    {

    "number": "The Current page, default=1",

    "next_page_number": "The Next page number or null",

    "previous_page_number": "The Previous page number or null",

    "paginator": {

    "num_pages": "The total numbers of pages"

    },

    "has_next": "Boolean if there is a next page",

    "has_previous": "Boolean if there is a previous page"

    }


    Full Body Example:


    {

    "count": 100,

    "data": ["value-0", "[...]", "value-9"],

    "success": true,

    "pagination": {

    "number": 1,

    "next_page_number": 2,

    "previous_page_number": null,

    "paginator": {

    "num_pages": 10

    },

    "has_next": true,

    "has_previous": false

    }

    }


    Pagination - Parameters​


    You can add those values to manipulate the pagination object in the URL Parameters.


    page


    limit


    Example:


    # To get the second page

    GET - https://api.edgegap.com/v1/apps?page=2


    # To change the count of element in one page (20/page)

    GET - https://api.edgegap.com/v1/apps?limit=20


    # You can mix those (20/page, second page)

    GET - https://api.edgegap.com/v1/apps?page=2&limit=20'
  termsOfService: https://console.edgegap.com/terms-of-service
  contact:
    name: Email
    email: info@edgegap.com
    url: https://edgegap.com
servers:
- url: https://api.edgegap.com
security:
- apiKey: []
tags:
- name: Deployments
  description: Deployments Control API - Please refer to this documentation to get started with deployments.
paths:
  /v1/deploy:
    post:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '422':
          description: Unprocessable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Create a Deployment request
      description: '[Rate Limit: 40/second] Create a new deployment. A deployment is a containerized instance of an application version running on the Edgegap platform.'
      operationId: deploy
      tags:
      - Deployments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployModel'
        required: true
  /v1/deployment/{request_id}/container-logs:
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-model-containerlogs'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '424':
          description: Endpoint Storage Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get Deployment Container Logs
      description: Retrieve the logs of your container. Logs are not available when your deployment is terminated. You can set up an endpoint storage to save your logs. Endpoint Storage Documentation
      operationId: deployment-get-logs
      parameters:
      - description: Log output format. `text` (default) returns plain-text lines; `ndjson` returns NDJSON records carrying the stream and timestamp of each line.
        name: format
        in: query
        schema:
          type: string
      tags:
      - Deployments
  /v1/deployments:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployments'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List All Deployments
      description: '[Rate Limit: 10/second] List all deployments.'
      operationId: deployments-get
      parameters:
      - name: query
        in: query
        description: Query to filter the deployments.
        schema:
          type: string
      tags:
      - Deployments
  /v1/deployments/bulk-stop:
    post:
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentBulkStopResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Delete Deployments in Bulk
      description: Make a bulk delete of deployments using filters. All the deployments matching the given filters will be permanently deleted.
      operationId: deployments-bulk-delete
      tags:
      - Deployments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentBulkStopPayload'
        required: true
  /v1/deployments/{request_id}:
    parameters:
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    patch:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentUpdateResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Updates properties of a deployment
      description: Updates properties of a deployment. Currently only the `is_joinable_by_session` property can be updated.
      operationId: deployment-update
      tags:
      - Deployments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentUpdatePayload'
        required: true
  /v1/hooks/stop/{request_id}:
    post:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — deployment is protected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Stop initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HooksStopResponse'
      summary: '[Internal] Stop a deployment via container exit hook'
      description: Internal endpoint called by ExternalHooksManager when a container exits and the AppVersion restart policy requires the deployment to be stopped. Not intended for direct client use.
      operationId: hooks-stop-deployment
      parameters:
      - name: request_id
        in: path
        required: true
        description: Unique identifier of the deployment to stop
        schema:
          type: string
      tags:
      - Deployments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HooksStopPayload'
        required: true
  /v1/self/stop/{request_id}/{access_point_id}:
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRequestReceived'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete'
      summary: Delete a Deployment from inside the container
      description: Delete a deployment from the inside of a container. You should use this URL inside your deployment. The URL is injected in your deployment and can be found via the environment variable ARBITRIUM_DELETE_URL.
      operationId: self-deployment-delete
      parameters:
      - name: request_id
        in: path
        required: true
        description: "Unique Identifier to keep track of your request across all Arbitrium ecosystem. It's included in the response of the app deploy, example: \n\n\t93924761ccde"
        schema:
          type: string
      - name: access_point_id
        in: path
        required: true
        description: Access Point Number provided by our system
        schema:
          type: integer
      - name: authorization
        in: header
        required: true
        description: Auto Generated token. This token is injected in your deployment and can be found via the environment variable named ARBITRIUM_DELETE_TOKEN
        schema:
          type: string
      - name: container_log_storage
        in: query
        description: If you want to enable the container log storage for the deployment. You can put 'true' if you already have endpoint storage associated with your deployment's app version. You can put 'false' if it is enabled by default and you want to disable it for this specific request. Or you can put the name of your endpoint storage and if it is valid we will store the container logs.
        schema:
          type: string
      security: []
      tags:
      - Deployments
  /v1/status/{request_id}:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get a Deployment Status and Information
      description: '[Rate Limit: 20/second] Retrieve the information for a deployment.'
      operationId: deployment-status-get
      parameters:
      - name: request_id
        in: path
        required: true
        description: "Unique Identifier to keep track of your request across all Arbitrium ecosystem. It's included in the response of the app deploy, example: \n\n\t93924761ccde"
        schema:
          type: string
      tags:
      - Deployments
  /v1/stop/{request_id}:
    delete:
      responses:
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Instance Already terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRequestReceived'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete'
      summary: Stop a deployment
      description: Request to stop a Deployment, triggering a graceful shutdown (SIGTERM). Returns 200 or 202 if deployment status is not READY and not ERROR, and stops deployment once either of these statuses is reached - see Deployment Lifecycle.
      operationId: deployment-delete
      parameters:
      - name: request_id
        in: path
        required: true
        description: "Unique Identifier to keep track of your request across all Edgegap ecosystem. It's included in the response of the app deploy, example: \n\n\t93924761ccde"
        schema:
          type: string
      - name: container_log_storage
        in: query
        description: If you want to enable the container log storage for the deployment. You can put 'true' if you already have endpoint storage associated with your deployment's app version. You can put 'false' if it is enabled by default and you want to disable it for this specific request. Or you can put the name of your endpoint storage and if it is valid we will store the container logs.
        schema:
          type: string
      tags:
      - Deployments
components:
  schemas:
    HooksStopResponse:
      required:
      - message
      - request_id
      properties:
        request_id:
          type: string
          description: Unique identifier of the deployment being stopped
          example: c0653765de3b
        message:
          type: string
          description: Confirmation message
          example: stop initiated
      type: object
    Delete:
      required:
      - message
      properties:
        message:
          type: string
          description: A message depending of the request termination
          example: Instance 93924761ccde will be deleted
        deployment_summary:
          description: The status/summary of the deployment
          $ref: '#/components/schemas/Status'
      type: object
    DeploymentUpdatePayload:
      properties:
        is_joinable_by_session:
          type: boolean
          description: Whether a session can connect to this deployment or not.
      type: object
      additionalProperties: false
    Pagination:
      properties:
        number:
          type: integer
          description: Current page number
        next_page_number:
          type: integer
          description: Next page number
        previous_page_number:
          type: integer
          description: Previous page number
        paginator:
          $ref: '#/components/schemas/Paginator'
        has_next:
          type: boolean
          description: If there is a next page
        has_previous:
          type: boolean
          description: If there is a previous page
      type: object
    DeploymentBulkStopFiltersPayload:
      required:
      - field
      - filter_type
      - values
      properties:
        field:
          type: string
          description: The field on which to apply the filter
          example: request_id
          enum:
          - request_id
          - deployment_tags
        values:
          type: array
          description: Values that will be used for the filter
          example:
          - c0653765de3b
          items:
            type: string
        filter_type:
          type: string
          description: 'Types of filter used. Possible values are: [''any'', ''all'', ''not'']'
          example: any
          enum:
          - any
          - all
          - not
      type: object
    DeployEnvModel:
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: Key of the environment variable. This key will be used to access the value in your container.
          example: MAP
        value:
          type: string
          description: Value of the environment variable. This value will be set in your container. Max 4096 characters.
          example: Forest-2
        is_hidden:
          type: boolean
          description: If true, the environment variable will be encrypted and only decrypted in the container.
          example: false
      type: object
    DeploymentUpdateResponse:
      required:
      - is_joinable_by_session
      properties:
        is_joinable_by_session:
          type: boolean
          description: If the deployment is joinable by sessions
      type: object
    LocationModel:
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          description: Desired Latitude
          example: 45.5
        longitude:
          type: number
          description: Desired Longitude
          example: -73.56
      type: object
    Status:
      required:
      - app_name
      - app_version
      - current_status
      - elapsed_time
      - error
      - fqdn
      - max_duration
      - public_ip
      - request_id
      - running
      - start_time
      - whitelisting_active
      properties:
        request_id:
          type: string
          description: The Unique ID of the Deployment's request
          example: c0653765de3b
        fqdn:
          type: string
          description: The FQDN that allow to connect to your Deployment
          example: abc123.test.edgegap.com
        app_name:
          type: string
          description: The name of the deployed App
          example: test
        app_version:
          type: string
          description: The version of the deployed App
          example: v1
        current_status:
          type: string
          description: The current status of the Deployment
          example: Status.DEPLOYING
        running:
          type: boolean
          description: True if the current Deployment is ready to be connected and running
          example: true
        whitelisting_active:
          type: boolean
          description: True if the current Deployment is ACL protected
          example: true
        start_time:
          type: string
          description: Timestamp of the Deployment when it is up and running
          example: '2026-10-19 20:00:37.815706'
        removal_time:
          type: string
          description: Timestamp of the end of the Deployment
          example: '2026-10-19 20:00:37.815706'
        elapsed_time:
          type: integer
          description: Time since the Deployment is up and running in seconds
        last_status:
          type: string
          description: The last status of the Deployment
          example: Status.SEEKING
        error:
          type: boolean
          description: True if there is an error with the Deployment
          example: true
        error_detail:
          type: string
          description: The error details of the Deployment
          example: ''
        ports:
          type: object
          example:
            web:
              external: 31587
              internal: 8080
              protocol: http
              name: web
              tls_upgrade: true
              link: https://example.com:31587
              proxy: 65001
            '7777':
              external: 31669
              internal: 7777
              protocol: UDP
              name: '7777'
              tls_upgrade: false
              link: example.com:31669
              proxy: 65002
          additionalProperties:
            $ref: '#/components/schemas/PortMapping'
        public_ip:
          type: string
          description: The public IP
          example: 100.10.0.85
        sessions:
          type: array
          description: List of Active Sessions if Deployment App is Session Based
          items:
            $ref: '#/components/schemas/DeploymentSessionContext'
        location:
          description: Location related information
          $ref: '#/components/schemas/DeploymentLocation'
        tags:
          type: array
          description: List of tags associated with the deployment
          items:
            type: string
            example: production
        sockets:
          type: integer
          description: The Capacity of the Deployment
          example: '5'
        sockets_usage:
          type: integer
          description: The Capacity Usage of the Deployment
          example: '2'
        command:
          type: string
          description: The command to use in the container, null mean it will take the default of the container
          example: ''
        arguments:
          type: string
          description: The arguments to use in the container, null mean it will take the default of the container
          example: ''
        max_duration:
          type: integer
          description: The deployment's maximum duration is the time, in minutes, that the deployment will remain active before automatically closing.
      type: object
    api-model-containerlogs:
      properties:
        logs:
          type: string
          description: Auto Generated Field for logs
          example: Logs of the container
        encoding:
          type: string
          description: Auto Generated Field for encoding
          example: utf-8
        crash_logs:
          type: string
          description: Auto Generated Field for crash_logs
          example: Logs of the container when it crashed
        crash_data:
          $ref: '#/components/schemas/api-model-containercrashdata'
        logs_link:
          type: string
          description: Auto Generated Field for logs_link
          example: Link to the logs
      type: object
    Paginator:
      properties:
        num_pages:
          type: integer
          description: Total pages count
      type: object
    HooksStopPayload:
      required:
      - exit_code
      - exit_reason
      - restart_policy
      properties:
        exit_code:
          type: integer
          description: Exit code returned by the container process
          example: 137
        exit_reason:
          type: string
          description: Human-readable reason for the container exit as reported by Kubeless
          example: error
        restart_policy:
          type: string
          description: Restart policy configured on the AppVersion that triggered this stop
          example: never
          enum:
          - always
          - never
          - on_failure
      type: object
    DeploymentLocation:
      required:
      - administrative_division
      - city
      - continent
      - country
      - latitude
      - longitude
      - timezone
      properties:
        city:
          type: string
          description: City of the deployment
          example: Montreal
        country:
          type: string
          description: Country of the deployment
          example: Canada
        continent:
          type: string
          description: Continent of the deployment
          example: North America
        administrative_division:
          type: string
          description: Administrative division of the deployment
          example: Quebec
        timezone:
          type: string
          description: Timezone of the deployment
          example: Eastern Time
        latitude:
          type: number
          description: Latitude of the deployment
          example: 45.508888
        longitude:
          type: number
          description: Longitude of the deployment
          example: -73.561668
      type: object
    DeployModel:
      required:
      - app_name
      properties:
        app_name:
          type: string
          description: The application you want to deploy a version of.
          example: kart-racing
        version_name:
          type: string
          description: The application version you want to deploy a container, if not present, the last version created is automatically chosen.
          example: production-v1.0
        is_public_app:
          type: boolean
          description: (DEPRECATED) - No longer used and you don't need to set it.
          default: false
        ip_list:
          type: array
          description: This parameter is not optional, but mutually exclusive with the geo_ip_list parameter. One of them is required. List of IP representing your users. These will be used to determine the best location for your deployment.
          items:
            type: string
            example: 1.2.3.4
        geo_ip_list:
          type: array
          description: This parameter is not optional, but mutually exclusive with the ip_list parameter. One of them is required. List of IP of your user with their location (latitude, longitude). We will use the coordinates instead of the IPs to determine the best location for your deployment.
          items:
            $ref: '#/components/schemas/GeoIpListModel'
        telemetry_profile_uuid_list:
          type: array
          description: (DEPRECATED)
          example:
          - 85cf70e6-f871-42c6-96f0-65ff5bd469b5
          items:
            type: string
        env_vars:
          type: array
          description: List of environment variables to set in your deployment instance. These variables will be available in your container.
          items:
            $ref: '#/components/schemas/DeployEnvModel'
        skip_telemetry:
          type: boolean
          description: If true, the deployment will skip the telemetry measurement. This result in a faster time to deploy.
          default: true
        location:
          description: Specify the centroid of the deployment instead of letting the system choose the best location. The system will do a best effort to deploy the container in the closest location to the specified coordinates.
          $ref: '#/components/schemas/LocationModel'
        webhook_url:
          type: string
          description: A URL to send a POST request when the deployment is ready. The request will contain the deployment status. The content of the request is the same as the `v1/status/{request_id}` endpoint.
          example: https://www.webhook.com/
        tags:
          type: array
          description: List of tags associated with the deployment. These tags will be shown in the dashboard.
          items:
            type: string
            example: production
        container_log_storage:
          description: Configuration for the container log storage. This will override the app version default configuration if set.
          $ref: '#/components/schemas/ContainerLogStorageModel'
        filters:
          type: array
          description: List of filters to apply to the deployment. The deployment will be deployed in a location that match the filters.
          items:
            $ref: '#/components/schemas/DeploymentFilterModel'
        ap_sort_strategy:
          type: string
          description: (DEPRECATED) - No longer used and you don't need to set it.
          example: basic
          enum:
          - basic
          - weighted
        command:
          type:
          - string
          - 'null'
          description: Allows to override the container command for this deployment. This is an advanced feature and should be used with caution.If set to null, the default command of the container will be used.
          example: null | 'string'
        arguments:
          type:
          - string
          - 'null'
          description: Allows to override the container arguments for this deployment. This is an advanced feature and should be used with caution.If set to null, the default arguments of the container will be used.
          example: null | 'string'
      type: object
    GeoIpListModel:
      required:
      - ip
      - latitude
      - longitude
      properties:
        ip:
          type: string
          description: IP address
          example: 1.2.3.4
        latitude:
          type: number
          description: Latitude of the IP/User
        longitude:
          type: number
          description: Longitude of the IP/User
      type: object
    PortMapping:
      properties:
        external:
          type: integer
          description: The Port to Connect from Internet
          minimum: 1
          maximum: 65535
        internal:
          type: integer
          description: The internal Port of the Container
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          description: The Protocol (i.e. 'TCP')
        name:
          type: string
          description: The Name of the port if given, default to internal port in string
        tls_upgrade:
          type: boolean
          description: If the port require TLS Upgrade
        link:
          type: string
          description: link of the port with scheme depending of the protocol
        proxy:
          type: integer
          description: Internal Proxy Mapping
      type: object
    Error:
      required:
      - message
      properties:
        message:
          type: string
          description: A message depending of the request termination
      type: object
    Deployments:
      properties:
        data:
          type: array
          description: List of active deployments
          items:
            $ref: '#/components/schemas/DeploymentListData'
        total_count:
          type: integer
          description: Total Objects in the Database
        pagination:
          description: Pagination Object
          $ref: '#/components/schemas/Pagination'
        message:
          type: array
          description: Extra Messages for the query
          example:
          - ''
          items:
            type: string
      type: object
    ContainerLogStorageModel:
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: If true, the container logs will be stored in the provided endpoint storage at the end of the request. If false, the container logs will not be stored, even if set up in the app version.
        endpoint_storage:
          type: string
          description: The name of the endpoint storage to be used. It must be the same as the one set on the dashboard when created. If container log storage is enabled without this parameter, we will try to take the app version endpoint storage. If there is no endpoint storage in your app version, the container logs will not be stored. If we don't find any endpointstorage associated with this name, the container logs will not be stored.
          example: my-endpoint
      type: object
    DeploymentBulkStopPayload:
      required:
      - filters
      properties:
        filters:
          type: array
          description: Filters used to match with deployments
          items:
            $ref: '#/components/schemas/DeploymentBulkStopFiltersPayload'
      type: object
    Request:
      required:
      - request_app
      - request_dns
      - request_id
      - request_user_count
      - request_version
      properties:
        request_id:
          type: string
          description: The identifier of the deployment request. This is used to track the deployment.
          example: 61b1be8f54d9
        request_dns:
          type: string
          description: This is the FQDN that allow to connect to your Deployment. It will not resolve until the deployment is ready.
          example: 61b1be8f54d9.pr.edgegap.net
        request_app:
          type: string
          description: The application that has been deployed.
          example: kart-racing
        filters:
          type: array
          description: List of filters applied to choose the location of the deployment.
          items:
            $ref: '#/components/schemas/DeploymentFilterModel'
        request_version:
          type: string
          description: The version of the application that has been deployed.
          example: v1.0
        request_user_count:
          type: integer
          description: This is the number of IP you have provided in the deployment request.
          example: 4
        tags:
          type: array
          description: List of tags that have been injected in the deployment request. This field will only be present if tags were provided in the request.
          items:
            type: string
            example: production
        container_log_storage:
          description: Endpoint storage configuration that will be used to store the container logs when the deployment will be deleted. This field will only be present if container log storage was provided in the request.
          $ref: '#/components/schemas/ContainerLogStorageModel'
        location:
          description: The desired location centroid of the deployment. This field will only be present if a location was provided in the request.
          $ref: '#/components/schemas/LocationModel'
        ap_sort_strategy:
          type: string
          description: (DEPRECATED) - Will only be present if the request was made with the ap_sort_strategy field.
          example: basic
          enum:
          - basic
          - weighted
      type: object
    DeploymentFilterModel:
      required:
      - field
      - filter_type
      - values
      properties:
        field:
          type: string
          description: The deployment's field to filter on. See https://docs.edgegap.com/learn/advanced-features/deployments#filter-deployments for more details.
          example: city
        values:
          type: array
          description: The values to filter on.
          example:
          - Montreal
          items:
            type: string
        filter_type:
          type: string
          description: The type of filter.
          example: any
          enum:
          - any
          - all
          - not
      type: object
    DeploymentListData:
      required:
      - fqdn
      - public_ip
      - ready
      - request_id
      - start_time
      properties:
        request_id:
          type: string
          description: Unique UUID
          example: 2d35052ec4e9
        fqdn:
          type: string
          description: The FQDN that allow to connect to your deployment
          example: abc123.test.edgegap.com
        start_time:
          type: string
          description: Timestamp of the deployment when it is up and running
          example: '2026-10-19 20:00:37.815706'
        ready:
          type: boolean
          description: If the deployment is ready
          example: true
        public_ip:
          type: string
          description: The public IP
          example: 100.10.0.85
        ports:
          type: object
          example:
            web:
              external: 31587
              internal: 8080
              protocol: http
              name: web
              tls_upgrade: true
              link: https://example.com:31587
              proxy: 65001
            '7777':
              external: 31669
              internal: 7777
              protocol: UDP
              name: '7777'
              tls_upgrade: false
              link: example.com:31669
              proxy: 65002
          additionalProperties:
            $ref: '#/components/schemas/PortMapping'
        tags:
          type: array
          description: List of tags associated with the deployment
          items:
            type: string
            example: production
        sockets:
          type: integer
          description: The capacity of the deployment
          example: '5'
        sockets_usage:
          type: integer
          description: The capacity usage of the deployment
          example: '2'
        is_joinable_by_session:
          type: boolean
          description: If the deployment is joinable by sessions
      type: object
    DeleteRequestReceived:
      required:
      - message
      properties:
        message:
          type: string
          description: Message to confirm that the delete request has been received
          example: 1a9e4ff02cce - Delete request will be processed soon
      type: object
    DeploymentSessionContext:
      required:
      - kind
      - linked
      - ready
      - session_id
      - status
      - user_count
      properties:
        session_id:
          type: string
          description: Unique UUID
          example: abc123
        status:
          type: string
          description: Current status of the session
          example: Status.READY
        ready:
          type: boolean
          description: If the session is linked to a Ready deployment
          example: true
        linked:
          type: boolean
          description: If the session is linked to a deployment
          example: true
        kind:
          type: string
          description: Type of session created
          example: DEFAULT | SEATS | MATCH
        user_count:
          type: integer
          description: Count of user this session currently have
          example: '10'
      type: object
    DeploymentStopResponse:
      required:
      - request_id
      properties:
        request_id:
          type: string
          description: The id of the request for a deployment
          example: c0653765de3b
      type: object
    DeploymentBulkStopResponse:
      required:
      - processable
      properties:
        processable:
          type: array
          description: A list deployments that can be processed to be stopped
          items:
            $ref: '#/components/schemas/DeploymentStopResponse'
      type: object
    api-model-containercrashdata:
      properties:
        exit_code:
          type: integer
          description: Auto Generated Field for exit_code
          example: 1
        message:
          type: string
          description: Auto Generated Field for message
          example: Container crashed
        restart_count:
          type: integer
          description: Auto Generated Field for restart_count
          example: 1
      type: object
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: authorization
      description: 'To access Edgegap API, generate (and view) your secret tokens in Dashboard - User Settings / Tokens. Add your secret token with each API request as an HTTP header (include the word token): `Authorization: token xxxxxxxx-e458-4592-b607-c2c28afd8b62`'
