        last_updated:
          type: string
          description: UTC time of pull profile last update
          example: '2022-01-01 00:00:00.000000'
      type: object
    EndpointStoragePatchPayload:
      properties:
        name:
          type: string
          description: Name of the Endpoint Storage
          example: my-s3-endpoint
        access_key_id:
          type: string
          description: Your access key ID to connect to your S3 Bucket.
          example: my-access-key-id
        endpoint:
          type: string
          description: Full URL to your S3 Bucket with https or http. It's recommended to not include your bucket name as a subdomain
          example: https://us-east-1.your-s3-provider.com
        bucket:
          type: string
          description: Your secret access key to connect to your S3 Bucket. Will be encrypted.
          example: my-bucket
        output_format:
          type: string
          description: The format how the logs will be exported to the bucket.
          default: TEXT
          example: NDJSON
          enum:
          - TEXT
          - NDJSON
        container_log_version:
          type: string
          description: Log pipeline version. `v1` stores a single file per deployment at the end of the run. `v2` uses a streaming pipeline that writes chunked logs to S3 in real time.
          example: v1
