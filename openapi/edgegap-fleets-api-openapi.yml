          description: Based on the number of sockets connected, how filled should a session deployment be before initiating a scale-up deployment. Float between 0.1 and 1.
          default: 0.9
          minimum: 0.1
          maximum: 1
        data:
          type: object
          description: JSON object for your filters. See our documentation for more information.
          example:
            filters:
            - field: city
              values:
              - Montreal
              filter_type: any
        create_time:
          type: string
          description: UTC time of policy creation
          example: '2022-01-01 00:00:00.000000'
        last_updated:
          type: string
          description: UTC time of policy last update
          example: '2022-01-01 00:00:00.000000'
      type: object
    Error:
      required:
      - message
      properties:
        message:
          type: string
          description: A message depending of the request termination
      type: object
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: authorization
      description: 'To access Edgegap API, generate (and view) your secret tokens in Dashboard - User Settings / Tokens. Add your secret token with each API request as an HTTP header (include the word token): `Authorization: token xxxxxxxx-e458-4592-b607-c2c28afd8b62`'
