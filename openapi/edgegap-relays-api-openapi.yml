components:
  schemas:
    RelayUserRevokePayload:
      required:
      - authorization_token
      - session_id
      properties:
        session_id:
          type: string
          description: 'Session Request ID (ex: 0724828881e2-S)'
          example: 0724828881e2-S
        authorization_token:
          type: integer
          description: Relay Authorization Token
          example: 3500589645
      type: object
    RelaySessionCreatePayload:
      required:
      - users
      properties:
        users:
          type: array
          description: List of IP Addresses of session users
          minItems: 1
          items:
            $ref: '#/components/schemas/RelaySessionUser'
        filters:
          type: array
          description: List of location filters to apply to the session
          items:
            $ref: '#/components/schemas/RelayFilterModel'
        webhook_url:
          type: string
          description: URL to send the session data to
          example: https://my-webhook.com/dump
      type: object
    Paginator:
      properties:
        num_pages:
          type: integer
          description: Total pages count
      type: object
    ClientRelayPort:
      properties:
        port:
          type: integer
          description: The port number
          example: 32001
        protocol:
          type: string
          description: The protocol of the port
          example: UDP
        link:
          type: string
          description: The link to the port
          example: 7349356945f1.st.edgegap.net:32001
      type: object
    RelaySessionUser:
      required:
      - ip
      properties:
        ip:
          type: string
          description: IP Address of session user
          example: 1.1.1.1
      type: object
      additionalProperties: false
    RelayUserAuthorizePayload:
      required:
      - session_id
      - user_ip
      properties:
        session_id:
          type: string
          description: 'Session Request ID (ex: 0724828881e2-S)'
          example: 0724828881e2-S
        user_ip:
          type: string
          description: User Ip to Authorize
          example: 1.1.1.1
      type: object
    Pagination:
      properties:
        number:
          type: integer
          description: Current page number
        next_page_number:
          type: integer
          description: Next page number
        previous_page_number:
          type: integer
          description: Previous page number
        paginator:
          $ref: '#/components/schemas/Paginator'
        has_next:
          type: boolean
          description: If there is a next page
        has_previous:
          type: boolean
          description: If there is a previous page
      type: object
    RelaySessionUserResponse:
      properties:
        ip_address:
          type: string
          description: The IP Address of the user
          example: 1.1.1.1
        latitude:
          type: number
          description: The latitude of the user
          example: 45.5088
        longitude:
          type: number
          description: The longitude of the user
          example: -73.5878
        authorization_token:
          type: integer
          description: The authorization token of the user
          example: 21986334
      type: object
    RelaySessionBaseResponse:
      required:
      - linked
      - ready
      - session_id
      - status
      properties:
        session_id:
          type: string
          description: The session ID
          example: 7349356945f1-S
        authorization_token:
          type: integer
          description: The authorization token for the session
          example: 3500589645
        status:
          type: string
          description: The status of the session
          example: READY
        ready:
          type: boolean
          description: If the session is ready to be used
        linked:
          type: boolean
          description: If the session is linked to a relay
        error:
          type: string
          description: The error message if the session failed
          example: Session failed
        session_users:
          type: array
          description: List Session Users
          items:
            $ref: '#/components/schemas/RelaySessionUserResponse'
        relay:
          description: The relay details the session is linked to
          allOf:
          - $ref: '#/components/schemas/RelayResponse'
        webhook_url:
          type: string
          description: The webhook URL that we will call once the session is ready
          example: https://my-webhook.com/dump
      type: object
    RelaySessionUserBaseResponse:
      required:
      - linked
      - ready
      - session_id
      - status
      properties:
        session_id:
          type: string
          description: The session ID
          example: 7349356945f1-S
        authorization_token:
          type: integer
          description: The authorization token for the session
          example: 3500589645
        status:
          type: string
          description: The status of the session
          example: READY
        ready:
          type: boolean
          description: If the session is ready to be used
        linked:
          type: boolean
          description: If the session is linked to a relay
        error:
          type: string
          description: The error message if the session failed
          example: Session failed
        session_user:
          description: List Session Users
          allOf:
          - $ref: '#/components/schemas/RelaySessionUserResponse'
        relay:
          description: The relay details the session is linked to
          allOf:
          - $ref: '#/components/schemas/RelayResponse'
        webhook_url:
          type: string
          description: The webhook URL that we will call once the session is ready
          example: https://my-webhook.com/dump
      type: object
    RelayFilterModel:
      required:
      - field
      - filter_type
      - values
      properties:
        field:
          type: string
          description: The field to filter
          example: location
        values:
          type: array
          description: The values to filter
          example:
          - US
          items:
            type: string
        filter_type:
          type: string
          description: The type of filter
          example: any
          enum:
          - any
          - all
          - not
      type: object
    MappedPortResponse:
      properties:
        server:
          $ref: '#/components/schemas/ServerRelayPort'
        client:
          $ref: '#/components/schemas/ClientRelayPort'
      type: object
    RelaySessionListResponse:
      properties:
        sessions:
          type: array
          description: List of relay sessions
          items:
            $ref: '#/components/schemas/RelaySessionBaseResponse'
        pagination:
          description: Pagination Object
          $ref: '#/components/schemas/Pagination'
      type: object
    Error:
      required:
      - message
      properties:
        message:
          type: string
          description: A message depending of the request termination
      type: object
    RelayResponse:
      properties:
        ip:
          type: string
          description: The IP Address of the relay
          example: 2.2.2.2
        host:
          type: string
          description: The host of the relay
          example: 7349356945f1.st.edgegap.net
        ports:
          $ref: '#/components/schemas/MappedPortResponse'
      type: object
    ServerRelayPort:
      properties:
        port:
          type: integer
          description: The port number
          example: 32000
        protocol:
          type: string
          description: The protocol of the port
          example: UDP
        link:
          type: string
          description: The link to the port
          example: 7349356945f1.st.edgegap.net:32000
      type: object
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: authorization
      description: 'To access Edgegap API, generate (and view) your secret tokens in Dashboard - User Settings / Tokens. Add your secret token with each API request as an HTTP header (include the word token): `Authorization: token xxxxxxxx-e458-4592-b607-c2c28afd8b62`'
